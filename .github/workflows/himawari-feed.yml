# 10分ごとに、ひまわりの最新観測と「あさひ・まひる・ゆうひ」（高解像度一式）を GitHub Pages に配信する。
# あさひ・まひる・ゆうひ は Actions のキャッシュ（store/）で回をまたいで持つ。
# Settings > Pages > Source は「GitHub Actions」。
# GitHub の定期実行(schedule)は新しいリポジトリだと動き出さないことがあるため、
# 実行の最後に「次の回」を自分で予約する（relay）。止めたいときは
# Settings > Secrets and variables > Actions > Variables に HIMAWARI_RELAY = off を作る。
name: himawari-feed
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pyspectral
          key: pyspectral-0.14.3
      - run: pip install -r pipeline/requirements.txt
      - run: python -c "from pyspectral.utils import download_luts, download_rsr; download_rsr(); download_luts(aerosol_types=['rayleigh_only'])"
      - uses: actions/cache/restore@v4
        with:
          path: store
          key: himawari-store-none
          restore-keys: himawari-store-
      - run: python pipeline/feed.py --out site --store store --site-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
      - id: storekey
        run: echo "key=himawari-store-$(sha256sum store/sets.json 2>/dev/null | cut -c1-16 || echo empty)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: hashFiles('store/sets.json') != ''
        continue-on-error: true
        with:
          path: store
          key: ${{ steps.storekey.outputs.key }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  relay:
    needs: deploy
    if: always() && vars.HIMAWARI_RELAY != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # 次の xx:04, xx:14, … まで待つ（観測から約14分後にデータがそろうため）
          now=$(date -u +%s); m=$(( (now / 60) % 10 )); s=$(( now % 60 ))
          wait=$(( ((14 - m) % 10) * 60 - s )); if [ $wait -lt 60 ]; then wait=$(( wait + 600 )); fi
          echo "wait ${wait}s"; sleep $wait
          # ほかに待機中・実行中の回があれば予約しない（二重の鎖を作らない）
          others=$(gh run list -R "$REPO" --workflow himawari-feed.yml --limit 20 --json status,databaseId \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != $RUN_ID)] | length")
          echo "others=$others"
          if [ "$others" = "0" ]; then gh workflow run himawari-feed.yml -R "$REPO" --ref main; fi
